[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markmeld"
dynamic = ["version"]
description = "Markmeld is a markup melder that combines structured yaml or markdown data into templated markdown output using jinja2."
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
keywords = ["bioinformatics", "sequencing", "ngs"]
authors = [
    { name = "Nathan Sheffield", email = "nsheff@virginia.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "jinja2>=3.1",
    "logmuse",
    "python-frontmatter",
    "pyyaml",
    "requests",
    "ubiquerg",
]

[project.optional-dependencies]
google = [
    "google-auth",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]
authormark = [
    "authormark-client>=0.1",
]
test = [
    "pytest>7.1",
]
docs = [
    "mkdocs>=1.2.2",
]

[project.scripts]
mm = "markmeld.cli:main"

[project.urls]
Homepage = "http://markmeld.databio.org"

[tool.hatch.version]
path = "markmeld/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["markmeld"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F403", "F405", "E501", "E402"]
