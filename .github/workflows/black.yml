name: Ruff

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
